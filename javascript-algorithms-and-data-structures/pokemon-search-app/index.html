<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Pokémon Search App</title>
</head>

<body>
    <main>
        <h1>Pokémon Search App</h1>
        <div class="search">
            <p>Search for Pokémon Name or ID:</p>
            <input id="search-input" required>
            <button id="search-button">Search</button>
        </div>
        <div id="pokemon-card">
            <div class="pokemon-name-id">
                <span id="pokemon-name">Name</span>
                <span id="pokemon-id">#ID</span>
            </div>
            <div id="pokemon-image">
                <div id="weight">Weight: </div>
                <div id="pokemon-sprite">
                    <img id="sprite" src="https://placehold.co/150x150/FFFFFF/FFF" alt="Pokemon Image Placeholder">
                </div>
                <div id="height">Height: </div>
            </div>
            <div class="pokemon-stats">
                <ul>
                    <li>HP: <span id="hp"></span></li>
                    <li>Attack: <span id="attack"></span></li>
                    <li>Defense: <span id="defense"></span></li>
                    <li>Sp. Attack: <span id="special-attack"></span></li>
                    <li>Sp. Defense: <span id="special-defense"></span></li>
                    <li>Speed: <span id="speed"></span></li>
                </ul>
            </div>
            <div id="types">
                <span>Type 1</span>
                <span>Type 2</span>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>

</html>
