<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <title>Palindrome Checker</title>
</head>

<body>
  <main>
    <h1>Is it a Palindrome?</h1>
    <section id="check-section">
      <p>Enter in text to check for a palindrome:</p>
      <input id="text-input"></input>
      <button id="check-btn">Check</button>
      <div id="result"></div>
    </section>
    <section id="explanation-section">
      <p>&#128161; A <i>palindrome</i> is a word or sentence that's spelled the same way both forward and backward,
        ignoring punctuation, case, and spacing.</p>
    </section>
  </main>
  <script src="script.js"></script>
</body>

</html>
